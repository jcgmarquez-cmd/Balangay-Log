<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-card">
        <h2>Create Account</h2>

        <div id="errorBanner" class="errorBanner" style="display: none;"></div>

        <form id="signupForm">
            <div class="input-group">
            <input type="text" id="fullname" placeholder="Full Name" required>
    </div>

    <div class="input-group">
        <input type="email" id="username" placeholder="Email" required>
     </div>

    <div class="input-group password-group">
        <input type="password" id="password" placeholder="Password (min 6 chars)" required>
        <button type="button" id="togglePassword">Show</button>
     </div>

     <div class="input-group">
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
     </div>
        
     <button type="submit" id="signupBtn">Sign Up</button>
     </form>

     <p class="signup-link">Already have an account? <a href="index.html">Log In</a></p>
     </div>
     
     <script src="signup.js"></script>
</body>

</html>
